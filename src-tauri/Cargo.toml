[package]
name = "capy"
version = "0.4.0-alpha.3"
edition = "2021"
description = "Capy — companion for AI coding sessions"

[features]
intervention-proof = []

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
url = "2"
portable-pty = "0.9"
uuid = { version = "1.27.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
