<svg id="pet" class="s-idle p-sit" viewBox="0 -20 270 230" role="img" aria-label="Capivara animada olhando de frente">
  <line x1="20" y1="183" x2="250" y2="183" stroke="#e3d6b4" stroke-width="2"/>
  <path d="M42 188 l3 -7 3 7 3 -5 3 5 M215 188 l3 -7 3 7 3 -5 3 5" fill="var(--grass)" opacity=".7"/>
  <ellipse id="shadow" cx="135" cy="184" rx="55" ry="5.5" fill="#000" opacity=".13"/>
  
  <g id="rig">
    <!-- Corpo da Capy V4: silhueta esbelta e postura ereta, perfeitamente equilibrada com a cabeça reduzida -->
    <path class="capy-body" d="M96 92 C84 108 80 136 84 162 C87 182 105 184 135 184 C165 184 183 182 186 162 C190 136 186 108 174 92 Z" fill="var(--fur)" stroke="var(--line)" stroke-width="2.2"/>
    <!-- Peito / barriguinha harmoniosa -->
    <path class="capy-belly" d="M110 118 C100 134 98 158 106 172 C118 177 152 177 164 172 C172 158 170 134 160 118 Z" fill="var(--belly)" opacity=".75"/>

    <!-- Orelhas autênticas de capivara: posicionadas nas laterais da cabeça reduzida -->
    <g id="ear">
      <!-- Orelha Esquerda -->
      <g class="ear-left">
        <path d="M84 50 C75 44 77 32 87 34 C94 35 98 42 94 51 C90 54 87 53 84 50 Z" fill="var(--fur-dark)" stroke="var(--line)" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M86 48 C80 43 81 36 87 37 C90 39 92 44 89 49 Z" fill="#e0a48a"/>
      </g>
      <!-- Orelha Direita -->
      <g class="ear-right">
        <path d="M186 50 C195 44 193 32 183 34 C176 35 172 42 176 51 C180 54 183 53 186 50 Z" fill="var(--fur-dark)" stroke="var(--line)" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M184 48 C190 43 189 36 183 37 C180 39 178 44 181 49 Z" fill="#e0a48a"/>
      </g>
    </g>

    <g id="faceAnim">
      <!-- Cabeça V4 (proporção reduzida e elegante, perfeitamente integrada ao corpo) -->
      <path class="capy-head" d="M104 35 C118 31 152 31 166 35 C183 40 189 52 189 73 L189 92 C189 113 172 121 135 121 C98 121 81 113 81 92 L81 73 C81 52 87 40 104 35 Z" fill="var(--fur)" stroke="var(--line)" stroke-width="2.2" stroke-linejoin="round"/>
      
      <!-- Focinho amplo e quadrado característico -->
      <path class="capy-snout-base" d="M93 72 C108 66 162 66 177 72 C188 77 190 88 186 100 C182 114 164 120 135 120 C106 120 88 114 84 100 C80 88 82 77 93 72 Z" fill="var(--fur-dark)"/>
      <path class="capy-snout-plate" d="M101 77 C114 73 156 73 169 77 C179 81 180 90 177 99 C173 108 157 114 135 114 C113 114 97 108 93 99 C90 90 91 81 101 77 Z" fill="var(--muzzle)" opacity=".75"/>
      
      <!-- Narinas no topo-frente do focinho -->
      <g class="capy-nostrils" fill="var(--ink)">
        <ellipse cx="124" cy="88" rx="4.2" ry="2.8" transform="rotate(-10 124 88)"/>
        <ellipse cx="146" cy="88" rx="4.2" ry="2.8" transform="rotate(10 146 88)"/>
      </g>
      
      <!-- Boquinha de capivara zen -->
      <path class="capy-mouth" d="M135 91 v5 M125 98 Q130 102 135 97 Q140 102 145 98" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
      
      <!-- Boquinha de bocejo (comportamento de acordar/alongar) -->
      <g class="mouth-yawn-group">
        <ellipse cx="135" cy="100" rx="5" ry="6.5" fill="#582a1a" stroke="var(--ink)" stroke-width="1.8"/>
        <ellipse cx="135" cy="102.5" rx="3.2" ry="2.4" fill="#f08888"/>
      </g>

      <!-- Raminho de graminha para lanche (comportamento de mastigar calmo) -->
      <g class="clover">
        <path d="M145 98 Q156 94 165 98 Q169 100 173 97" fill="none" stroke="#549932" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M162 93 Q167 89 166 95 Z M167 98 Q173 96 171 102 Z" fill="#69b83e"/>
      </g>
      
      <!-- Bochechas com blush fofo -->
      <ellipse class="blush-left" cx="91" cy="82" rx="6.5" ry="3.2" fill="var(--blush)" opacity=".45"/>
      <ellipse class="blush-right" cx="179" cy="82" rx="6.5" ry="3.2" fill="var(--blush)" opacity=".45"/>
      
      <!-- Olhinhos Grandes e Expressivos com brilho kawaii -->
      <g class="eye-open">
        <ellipse cx="107" cy="61" rx="7.8" ry="8.6" fill="var(--ink)"/>
        <ellipse cx="163" cy="61" rx="7.8" ry="8.6" fill="var(--ink)"/>
        <circle cx="109.5" cy="58.5" r="2.9" fill="#ffffff"/>
        <circle cx="165.5" cy="58.5" r="2.9" fill="#ffffff"/>
        <circle cx="105" cy="63.8" r="1.3" fill="#ffffff" opacity=".85"/>
        <circle cx="161" cy="63.8" r="1.3" fill="#ffffff" opacity=".85"/>
        <path d="M100 52 Q107 48 114 52" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M156 52 Q163 48 170 52" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      
      <!-- Olhos bem arregalados / curiosos (quando agentes precisam de você) -->
      <g class="eye-wide">
        <ellipse cx="107" cy="61" rx="9.2" ry="10" fill="var(--ink)"/>
        <ellipse cx="163" cy="61" rx="9.2" ry="10" fill="var(--ink)"/>
        <circle cx="109.8" cy="58" r="3.5" fill="#ffffff"/>
        <circle cx="165.8" cy="58" r="3.5" fill="#ffffff"/>
        <circle cx="104" cy="64.5" r="1.6" fill="#ffffff" opacity=".9"/>
        <circle cx="160" cy="64.5" r="1.6" fill="#ffffff" opacity=".9"/>
        <path d="M99 49 Q107 45 115 49" fill="none" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
        <path d="M155 49 Q163 45 171 49" fill="none" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
      </g>
      
      <!-- Olhos semicerrados relaxados (trabalhando ou descansando acordada) -->
      <g class="eye-half">
        <ellipse cx="107" cy="63" rx="7" ry="4.8" fill="var(--ink)"/>
        <ellipse cx="163" cy="63" rx="7" ry="4.8" fill="var(--ink)"/>
        <circle cx="109" cy="61.5" r="1.8" fill="#ffffff"/>
        <circle cx="165" cy="61.5" r="1.8" fill="#ffffff"/>
        <path d="M100 60 Q107 57 114 60 M156 60 Q163 57 170 60" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      
      <!-- Olhos felizes fechadinhos em arco (^ ^) para comemoração e conclusão -->
      <path class="eye-happy" d="M99 64 Q107 53 115 64 M155 64 Q163 53 171 64" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>
      
      <!-- Olhos de carinho / amor (> <) -->
      <path class="eye-love" d="M100 59 L107 64 L100 69 M114 59 L107 64 L114 69 M156 59 L163 64 L156 69 M170 59 L163 64 L170 69" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Olhos fechadinhos dormindo serenamente (- -) -->
      <path class="eye-closed" d="M99 62 Q107 70 115 62 M155 62 Q163 70 171 62" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Sobrancelhas de alerta -->
      <path class="brow-alert" d="M100 48 l10 -3 M160 45 l10 3" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Detalhes de pelinho na testa -->
      <path d="M130 43 l3 3 3 -4 3 4 3 -3" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
    </g>

    <!-- Patinhas dianteiras proporcionais -->
    <g class="front-paws" fill="var(--fur-dark)" stroke="var(--line)" stroke-width="2" stroke-linecap="round">
      <g class="anim fnA"><path d="M94 128 Q90 142 96 156 Q104 163 112 155 L108 133"/><path d="M98 150 l1 5 M104 151 v5"/></g>
      <g class="anim ffA"><path d="M176 128 Q180 142 174 156 Q166 163 158 155 L162 133"/><path d="M172 150 l-1 5 M166 151 v5"/></g>
    </g>

    <!-- Patas traseiras de capivara -->
    <g fill="var(--foot)" stroke="var(--line)" stroke-width="2" stroke-linecap="round">
      <path d="M90 170 Q80 182 94 184 H116 Q124 181 118 175 Z"/>
      <path d="M180 170 Q190 182 176 184 H154 Q146 181 152 175 Z"/>
      <path d="M93 178 v5 M101 179 v5 M169 179 v5 M177 178 v5"/>
    </g>

    <!-- Laptop compacto para quando os agentes trabalham -->
    <g class="laptop">
      <path d="M92 140 h86 l-4 38 H96 Z" fill="#39434c" stroke="var(--line)" stroke-width="2" stroke-linejoin="round"/>
      <rect x="99" y="146" width="72" height="25" rx="2" fill="#222d33"/>
      <path d="M88 178 h94 l-5 5 H93 Z" fill="#7a8794" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M129 157 l-5 3 5 3 M141 157 l5 3 -5 3 M137 154 l-4 12" fill="none" stroke="#c4d7b1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- A icônica laranjinha da capivara na cabeça -->
    <g id="orange">
      <g class="orange">
        <circle cx="135" cy="23" r="9.2" fill="#ffa21f" stroke="var(--line)" stroke-width="2"/>
        <path d="M135 15 q3.5 -6 9.5 -4 q-2.7 5 -9.5 4z" fill="#6aa84f" stroke="var(--line)" stroke-width="1.4"/>
        <circle cx="131.5" cy="20.5" r="2" fill="#fff" opacity=".5"/>
      </g>
    </g>
  </g>

  <!-- Partículas de corações para carinho / amor -->
  <g class="hearts" aria-hidden="true">
    <path class="heart h1" d="M112 36 C112 31 107 27 102 31 C97 27 92 31 92 36 C92 43 102 48 102 48 C102 48 112 43 112 36 Z" fill="#ff5e84"/>
    <path class="heart h2" d="M174 32 C174 27 170 24 166 27 C162 24 158 27 158 32 C158 38 166 43 166 43 C166 43 174 38 174 32 Z" fill="#ff4270"/>
    <path class="heart h3" d="M141 10 C141 6 137 3 133 6 C130 3 126 6 126 10 C126 15 133 19 133 19 C133 19 141 15 141 10 Z" fill="#ff7597"/>
  </g>

  <!-- Partículas de estrelinhas / comemoração -->
  <g class="sparkles">
    <g><path d="M47 42 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffc933"/></g>
    <g><path d="M135 -9 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ff8fb5"/></g>
    <g><path d="M223 42 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#6cc9f0"/></g>
  </g>

  <!-- Balãozinho de atenção -->
  <g class="attention-mark" aria-hidden="true">
    <path d="M188 19 Q188 14 193 14 H214 Q219 14 219 19 V35 Q219 40 214 40 H206 L199 47 V40 H193 Q188 40 188 35 Z" fill="#f7f0df" stroke="#8a5b18" stroke-width="2" stroke-linejoin="round"/>
    <path d="M203.5 20 V29 M203.5 34 V34.5" fill="none" stroke="#8a5b18" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- Sequência encantadora de ZZZZZZZZZZZZ flutuando quando parada / dormindo -->
  <g class="zzz" aria-hidden="true">
    <text class="z z1" x="194" y="98">z</text>
    <text class="z z2" x="206" y="82">Z</text>
    <text class="z z3" x="218" y="64">z</text>
    <text class="z z4" x="230" y="46">Z</text>
    <text class="z z5" x="240" y="26">z</text>
  </g>
</svg>
