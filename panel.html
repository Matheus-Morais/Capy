<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capy — sessões</title><script type="module" src="/src/dashboard.ts"></script></head>
<body data-surface="panel"><main class="sheet panel"><header class="sheet-header"><div><h1>Suas sessões</h1><p id="subtitle">Carregando sessões…</p></div><button id="close" class="icon-button" aria-label="Fechar painel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header><p class="simulation">Demonstração · sessões, respostas e cotas simuladas</p><p id="error" class="error" role="alert" hidden></p><div class="panel-grid"><section><section id="sessions" aria-label="Sessões acompanhadas"></section><button id="restore" class="restore" hidden>Restaurar sessões ocultas</button></section><aside><section id="integrations" class="integrations" hidden aria-label="Diagnóstico das integrações"></section><section class="quotas" aria-labelledby="quotaTitle"><h2 id="quotaTitle">Cotas disponíveis <span>Simulação</span></h2><div id="quotaRows"></div></section><section class="demo-controls"><h2>Fonte das sessões</h2><div class="scenarios"><button data-scenario="real">Sessões reais</button><button data-scenario="waiting">Demo: precisam de você</button><button data-scenario="working">Demo: trabalhando</button><button data-scenario="done">Demo: concluídas</button><button data-scenario="sleeping">Demo: sem sessões</button></div><label><input id="reduceMotion" type="checkbox"> Reduzir movimento</label><p>Arraste a capivara para posicioná-la. Clique nela para abrir o resumo.</p></section></aside></div><p id="notice" class="notice" role="status" aria-live="polite"></p></main></body></html>
